{{- if .Values.serviceAccount.create -}}
# The broker's own ServiceAccount (BROKKR-T-0309).
#
# The broker does not call the Kubernetes API. Config reload reads a file that
# the kubelet mounts from the dynamic ConfigMap, so it needs no Role or
# RoleBinding. This account exists so the pod does not run as the namespace
# `default` account, and so the API token is not mounted by default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "brokkr-broker.serviceAccountName" . }}
  labels:
    {{- include "brokkr-broker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
