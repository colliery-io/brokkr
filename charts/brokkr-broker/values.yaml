---
# =============================================================================
# CONFIGURATION HOT-RELOAD
# =============================================================================
# With `configReload.enabled: true` (the default), these settings apply
# without a pod restart (BROKKR-T-0292):
#   - broker.logLevel
#   - broker.diagnosticCleanupIntervalSeconds, broker.diagnosticMaxAgeHours
#   - broker.webhookDeliveryIntervalSeconds, broker.webhookDeliveryBatchSize
#   - broker.webhookCleanupRetentionDays
#
# How it works: the chart renders these keys as a TOML file in a second
# ConfigMap (`<release>-dynamic`), mounts it at /etc/brokkr as a directory, and
# sets BROKKR_CONFIG_FILE. The broker watches that file. The kubelet updates the
# file after the ConfigMap changes, usually within about a minute, and the
# broker then reloads after `configReload.debounceSeconds`.
#
# The broker does not call the Kubernetes API to do this, so the chart creates
# no Role or RoleBinding for it (BROKKR-T-0309).
#
# Limits:
#   - If you set RUST_LOG (for example in `extraEnv`), RUST_LOG sets the log
#     filter and `broker.logLevel` has no effect, at startup or on reload.
#   - Every other setting requires a pod restart, and `helm upgrade` does not
#     do it for you: the pod template has no ConfigMap checksum annotation.
#     Run `kubectl rollout restart deploy/<release>-brokkr-broker`, or use an
#     external reload controller (the env ConfigMap has a `checksum/config`
#     annotation for that). Restart-only settings include:
#       - database.*, postgresql.*
#       - cors.* (the CORS layer is built once at startup)
#       - broker.webhookEncryptionKey, broker.pakHash
#       - telemetry.*
#
# `POST /api/v1/admin/config/reload` re-reads the same file on demand.
# =============================================================================

# Configuration hot-reload settings
configReload:
  # Mount the dynamic settings as a file and watch it, so the settings listed
  # above apply without a restart. When false, those settings are delivered
  # as environment variables and need a restart like the others.
  enabled: true

  # Debounce duration in seconds to prevent rapid successive reloads
  debounceSeconds: 5

# ServiceAccount for the broker pod (BROKKR-T-0309).
# The broker does not call the Kubernetes API, so the chart creates no RBAC.
serviceAccount:
  # Create a ServiceAccount for the broker. When false, the pod uses `name`,
  # or the namespace `default` account when `name` is empty.
  create: true
  # ServiceAccount name; generated from the release name when empty
  name: ""
  # Annotations for the ServiceAccount (for example a cloud IAM role binding)
  annotations: {}
  # Mount the Kubernetes API token in the pod. The broker does not use it.
  automountServiceAccountToken: false

# Broker container image configuration
image:
  # Container registry and repository for the broker image
  repository: ghcr.io/colliery-io/brokkr-broker
  # Image tag to deploy (use 'latest' for development, specific versions for production)
  tag: latest
  # Image pull policy (IfNotPresent, Always, Never)
  pullPolicy: IfNotPresent
  # Image pull secrets for private registries
  # pullSecrets:
  #   - name: ghcr-secret

# Number of broker replicas to run
# Note: Multiple replicas require session affinity or external session storage
replicaCount: 1

# HorizontalPodAutoscaler configuration for automatic scaling
# When enabled, overrides replicaCount with dynamic scaling
autoscaling:
  # Enable horizontal pod autoscaling
  enabled: false

  # Minimum number of replicas
  minReplicas: 1

  # Maximum number of replicas
  maxReplicas: 5

  # Target CPU utilization percentage for scaling
  # When average CPU exceeds this, HPA scales up
  targetCPUUtilizationPercentage: 70

  # Target memory utilization percentage for scaling (optional)
  # Uncomment to also scale on memory
  # targetMemoryUtilizationPercentage: 80

  # Scaling behavior configuration (optional)
  # Controls how fast HPA scales up/down
  # behavior:
  #   scaleDown:
  #     stabilizationWindowSeconds: 300
  #     policies:
  #       - type: Percent
  #         value: 50
  #         periodSeconds: 60
  #   scaleUp:
  #     stabilizationWindowSeconds: 0
  #     policies:
  #       - type: Percent
  #         value: 100
  #         periodSeconds: 15
  #       - type: Pods
  #         value: 4
  #         periodSeconds: 15
  #     selectPolicy: Max

# Kubernetes Service configuration
service:
  # Service type: ClusterIP (internal), LoadBalancer (external), NodePort
  type: ClusterIP
  # Service port for broker HTTP API
  port: 3000
  # Additional service annotations (useful for LoadBalancer configuration)
  #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  annotations: {}

# PostgreSQL database configuration
postgresql:
  # enabled: true deploys a bundled PostgreSQL instance (development/testing)
  # enabled: false uses an external PostgreSQL instance (production)
  enabled: true

  # External database configuration (used when enabled=false)
  external:
    # External database host (required when postgresql.enabled=false)
    host: ''
    # Database port
    port: 5432
    # Database name
    database: brokkr
    # Database username (not used when existingSecret is set)
    username: brokkr
    # Database password (not used when existingSecret is set)
    # WARNING: Do not commit production passwords to values files
    password: brokkr
    # PostgreSQL schema for multi-tenant deployments (optional)
    # When set, the broker will use this schema for data isolation
    # Leave empty for default (public) schema
    # Example: 'tenant_a', 'customer_1', 'dev', 'staging', 'prod'
    schema: ''

  # Use an existing Kubernetes secret for database credentials
  # The secret should contain a key with the full database connection URL
  # Applies to both bundled and external PostgreSQL
  # existingSecret: my-database-secret
  existingSecret: ''
  # Key name in existingSecret that contains the database URL
  # Default: database-url
  existingSecretKey: database-url

  # Bitnami PostgreSQL subchart configuration (used when enabled=true)
  # See https://github.com/bitnami/charts/tree/main/bitnami/postgresql for all options

  auth:
    # PostgreSQL username for broker application
    username: brokkr
    # PostgreSQL password for broker application
    # WARNING: Override this in production with a secure value or use existingSecret
    password: brokkr
    # PostgreSQL database name
    database: brokkr

  # Primary PostgreSQL instance configuration
  primary:
    # Persistence configuration for PostgreSQL data
    persistence:
      # Enable persistent storage (recommended for production)
      # Set to false for ephemeral storage (testing only - data lost on pod restart)
      enabled: true
      # Storage class to use for PVC
      # Empty string uses cluster default storage class
      storageClass: ""
      # Size of persistent volume
      size: 8Gi

    # Resource requests and limits for PostgreSQL
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# Additional environment variables to inject into broker pods
# Useful for configuration not covered by standard values
# extraEnv:
#   - name: RUST_LOG
#     value: "debug"
#   - name: CUSTOM_CONFIG
#     valueFrom:
#       configMapKeyRef:
#         name: my-config
#         key: custom-value
extraEnv: []

# Broker application settings
# These control runtime behavior of the broker
broker:
  # Log level for the broker application
  # @hot-reload: true - when configReload.enabled and RUST_LOG is not set
  # Valid values: trace, debug, info, warn, error
  logLevel: info

  # Diagnostic cleanup settings
  # @hot-reload: true - when configReload.enabled (the task reads them each pass)
  diagnosticCleanupIntervalSeconds: 900  # 15 minutes
  diagnosticMaxAgeHours: 1

  # Webhook delivery settings
  # @hot-reload: true - when configReload.enabled (the worker reads them each pass)
  webhookDeliveryIntervalSeconds: 5
  webhookDeliveryBatchSize: 50

  # Webhook delivery retention
  # @hot-reload: true - when configReload.enabled (the worker reads it each pass)
  webhookCleanupRetentionDays: 7

  # Webhook encryption key (hex-encoded 32-byte key)
  # @hot-reload: false - requires restart
  # If not set, a random key is generated on startup
  # WARNING: Changing this will make existing encrypted webhook data unreadable
  # WARNING: a value here is rendered into the broker ConfigMap in plaintext —
  # for GitOps / production, prefer the existingSecret option below.
  # webhookEncryptionKey: ""
  # Source the webhook encryption key from a pre-existing Kubernetes Secret
  # instead of webhookEncryptionKey. When set, the key is injected via
  # secretKeyRef (overriding the ConfigMap) and never touches values/git —
  # e.g. vended by external-secrets-operator from Vault / 1Password / AWS SM.
  webhookEncryptionKeyExistingSecret: ""                                    # name of the pre-existing Secret
  webhookEncryptionKeyExistingSecretKey: BROKKR__BROKER__WEBHOOK_ENCRYPTION_KEY  # key within that Secret

  # Admin PAK hash for day-zero bootstrap (BROKKR__BROKER__PAK_HASH).
  # @hot-reload: false - requires restart
  # WARNING: a value here is rendered into the broker ConfigMap in plaintext —
  # for GitOps / production, prefer the existingSecret option below.
  # pakHash: ""
  # Source the admin PAK hash from a pre-existing Kubernetes Secret instead of
  # pakHash. When set, injected via secretKeyRef (overriding the ConfigMap).
  pakHashExistingSecret: ""                            # name of the pre-existing Secret
  pakHashExistingSecretKey: BROKKR__BROKER__PAK_HASH   # key within that Secret

# CORS configuration for API access
# @hot-reload: false - requires restart (the CORS layer is built once when the
# router is constructed)
cors:
  # Allowed origins for CORS requests
  # Use "*" to allow all origins (not recommended for production)
  allowedOrigins:
    - "*"

  # Allowed HTTP methods
  allowedMethods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS

  # Allowed request headers
  allowedHeaders:
    - Authorization
    - Content-Type
    - Accept

  # Max age for CORS preflight cache (seconds)
  # @hot-reload: false - requires restart (see the CORS note above)
  maxAgeSeconds: 3600

# Resource requests and limits for broker pods
# Requests: minimum guaranteed resources
# Limits: maximum resources before throttling/eviction
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# AppArmor configuration
# AppArmor provides additional security but requires AppArmor-enabled host
apparmor:
  # Enable AppArmor annotations (requires AppArmor support on cluster nodes)
  enabled: false
  # AppArmor profile to use (runtime/default is most common)
  profile: runtime/default

# Pod-level security context for broker
# Controls security settings that apply to all containers in the pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  # Seccomp profile for syscall filtering (Kubernetes 1.19+)
  # Uncomment for production security hardening
  # seccompProfile:
  #   type: RuntimeDefault

# Container-level security context for broker
# Controls security settings specific to the broker container
containerSecurityContext:
  # Prevent privilege escalation
  allowPrivilegeEscalation: false
  # Enable read-only root filesystem for maximum security
  # Note: Requires emptyDir volumes for /tmp and other writable paths
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  # Drop all Linux capabilities and add back only required ones
  capabilities:
    drop:
      - ALL
    # Uncomment if specific capabilities are needed
    # add:
    #   - NET_BIND_SERVICE

# TLS
#
# The broker serves plain HTTP on port 3000 and cannot terminate TLS itself.
# Terminate TLS at the ingress (see `ingress.tls` below) or at a service mesh /
# reverse proxy in front of the broker. For automatic certificates, annotate the
# ingress for cert-manager (e.g. cert-manager.io/cluster-issuer) rather than
# issuing a certificate for the broker pod.

# Ingress configuration for external access
ingress:
  # Enable ingress resource creation
  enabled: false

  # Ingress class name (nginx, traefik, etc.)
  # Required for Kubernetes 1.18+
  className: 'nginx'

  # Ingress annotations for additional configuration
  # Common annotations:
  #   cert-manager.io/cluster-issuer: "letsencrypt-prod"
  #   nginx.ingress.kubernetes.io/ssl-redirect: "true"
  #   nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  annotations: {}

  # Ingress host configuration
  hosts:
    - host: brokkr.example.com
      paths:
        - path: /
          pathType: Prefix

  # TLS configuration for ingress
  # If cert-manager is enabled, certificates will be automatically generated
  # Otherwise, the secretName should reference an existing TLS secret
  tls:
    - secretName: brokkr-tls
      hosts:
        - brokkr.example.com

# Metrics and monitoring configuration
#
# The broker always serves /metrics on its HTTP port. There is no chart value
# that turns the endpoint off; restrict access with networkPolicy instead.
metrics:
  # ServiceMonitor configuration for Prometheus Operator
  serviceMonitor:
    # Enable ServiceMonitor CRD creation
    # Requires Prometheus Operator to be installed in the cluster
    enabled: false

    # Scrape interval for Prometheus
    interval: 30s

    # Scrape timeout (must be shorter than interval)
    # scrapeTimeout: 10s

    # Additional labels for ServiceMonitor (for Prometheus selector matching)
    # additionalLabels:
    #   prometheus: kube-prometheus

# NetworkPolicy configuration for restricting pod network access
networkPolicy:
  # Enable NetworkPolicy creation
  enabled: false

  # Allow ingress from specific sources (list of podSelector/namespaceSelector)
  # If empty, allows from any pod in the same namespace
  # Example:
  #   allowIngressFrom:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: ingress-nginx
  #       podSelector:
  #         matchLabels:
  #           app.kubernetes.io/name: ingress-nginx
  allowIngressFrom: []

  # Permit the metrics ingress rule below to be rendered at all.
  # Set false to deny scraping outright even if allowMetricsFrom is populated.
  # (Formerly metrics.enabled, which never gated the /metrics endpoint itself —
  # only this rule.)
  allowMetricsScraping: true

  # Allow metrics scraping from Prometheus namespace
  # Only applied when allowMetricsScraping is true; empty means no metrics
  # ingress rule is rendered.
  # Example:
  #   allowMetricsFrom:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: monitoring
  allowMetricsFrom: []

  # Allow egress for webhook deliveries to external HTTPS endpoints
  allowWebhookEgress: true

  # Additional custom egress rules
  # additionalEgressRules:
  #   - to:
  #       - ipBlock:
  #           cidr: 10.0.0.0/8
  #     ports:
  #       - protocol: TCP
  #         port: 443
  additionalEgressRules: []

# PodDisruptionBudget configuration for high availability during updates
podDisruptionBudget:
  # Enable PodDisruptionBudget creation
  enabled: false

  # Minimum number of pods that must be available during voluntary disruptions
  # Can be an integer or a percentage (e.g., "50%")
  minAvailable: 1

  # Maximum number of pods that can be unavailable during voluntary disruptions
  # Alternative to minAvailable - only set one
  # maxUnavailable: 1

# OpenTelemetry telemetry configuration for distributed tracing
telemetry:
  # Enable OpenTelemetry tracing
  enabled: false

  # OTLP endpoint for trace export (gRPC)
  # Examples:
  #   - Local collector: http://otel-collector:4317
  #   - Jaeger OTLP: http://jaeger-collector:4317
  #   - Tempo: http://tempo:4317
  otlpEndpoint: "http://otel-collector:4317"

  # Sampling rate (0.0 to 1.0)
  # 0.1 = 10% of traces sampled (recommended for production)
  # 1.0 = 100% of traces sampled (development/debugging)
  samplingRate: 0.1
