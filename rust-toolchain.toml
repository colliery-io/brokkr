# The Rust version of the root workspace. CI installs it from this file
# (.github/actions/setup-rust reads the channel; BROKKR-T-0416) and the Docker
# builder images use rust:1.99, so clippy and rustfmt give the same result
# locally and in CI (BROKKR-T-0355). Change the version here and in the
# Dockerfiles together; release.yml still names 1.99 for its own step.
# crates/brokkr-web has its own file.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
