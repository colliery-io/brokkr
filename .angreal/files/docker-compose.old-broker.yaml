---
# Pairing "old-broker" (BROKKR-T-0414): the broker of the last release with
# the agent of this checkout. It is a new agent in a cluster whose broker is
# not upgraded yet.
#
# Use it on top of docker-compose.yaml:
#   docker compose -f docker-compose.yaml -f docker-compose.old-broker.yaml up
# or `angreal tests bdd --pairing old-broker`. BROKKR_LAST_RELEASE is the
# version in the file LAST_RELEASE next to this one.
#
# The old broker must start on an empty database: it has fewer migrations
# than the broker of the checkout. `angreal tests bdd` removes the volumes
# before it starts the stack; a stack started by hand needs
# `docker compose down -v` first.
services:
  broker:
    image: ghcr.io/colliery-io/brokkr-broker:${BROKKR_LAST_RELEASE:?set BROKKR_LAST_RELEASE to the version in .angreal/files/LAST_RELEASE}
    build: !reset null
    pull_policy: always
