[project]
name = "brokkr"
version_from = "cargo"

[output]
format = "markdown"
path = "docs/src/content/docs/reference/api"
template = "starlight"

[rust]
crates = [
    "crates/brokkr-broker",
    "crates/brokkr-agent",
    "crates/brokkr-models",
    "crates/brokkr-utils",
]

[python]
package = "brokkr"
source = "sdks/python/brokkr/brokkr"
