[package]
name = "brokkr-bdd"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Independent from the root workspace, like tests/e2e and tests/sdk-contract.
[workspace]

[[bin]]
name = "brokkr-bdd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cucumber = "0.23"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
