---
name: Fast Code Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    uses: ./.github/workflows/setup.yml
  unit_tests:
    needs: setup
    uses: ./.github/workflows/unit_tests.yml

  # Path-filter: only run the slower integration / SDK-contract suites when
  # source actually changed. Doc-only / workflow-only PRs skip them. Without
  # these gates, every PR pays ~10 min for integration + another ~5 min for
  # the SDK contract matrix. Without the suites, broken tests sit on main
  # until nightly or release-tag time.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      sdk_contract: ${{ steps.filter.outputs.sdk_contract }}
      openapi: ${{ steps.filter.outputs.openapi }}
      console: ${{ steps.filter.outputs.console }}
      e2e_scenarios: ${{ steps.filter.outputs.e2e_scenarios }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'openapi/**'
              - '.angreal/**'
              - '.github/workflows/main.yml'
              - '.github/workflows/integration_tests.yml'
            sdk_contract:
              - 'crates/brokkr-broker/**'
              - 'crates/brokkr-client/**'
              - 'crates/brokkr-cli/**'
              - 'sdks/python/brokkr-client/**'
              - 'sdks/typescript/brokkr-client/**'
              - 'openapi/**'
              - 'tests/sdk-contract/**'
              - '.angreal/task_tests.py'
              - '.github/workflows/main.yml'
              - '.github/workflows/sdk_contract_tests.yml'
            # Anything that can change the emitted spec. `models/**` matters as
            # much as `api/**`: a doc comment on a model is rendered into the
            # spec description, and exactly that went undetected for several
            # commits (BROKKR-T-0315).
            openapi:
              - 'crates/brokkr-broker/src/api/**'
              - 'crates/brokkr-broker/examples/openapi_export.rs'
              - 'crates/brokkr-broker/Cargo.toml'
              - 'crates/brokkr-models/src/models/**'
              - 'crates/brokkr-client/**'
              - 'sdks/python/brokkr-client/**'
              - 'sdks/typescript/brokkr-client/**'
              - 'openapi/**'
              - '.angreal/task_openapi.py'
              - '.github/workflows/main.yml'
              - '.github/workflows/openapi.yml'
            # The operator console is outside the root workspace, so `code`
            # does not cover its gates (BROKKR-T-0351).
            console:
              - 'crates/brokkr-web/**'
              - '.github/workflows/main.yml'
              - '.github/workflows/console.yml'
            # The e2e scenarios outside the walkthrough (BROKKR-T-0323). Main
            # runs them each night; a PR runs them when it changes them.
            e2e_scenarios:
              - 'tests/e2e/**'
              - '.angreal/files/**'
              - '.github/workflows/e2e_scenarios.yml'

  integration_tests:
    needs: [setup, changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/integration_tests.yml
    secrets: inherit

  sdk_contract_tests:
    needs: [setup, changes]
    if: needs.changes.outputs.sdk_contract == 'true'
    uses: ./.github/workflows/sdk_contract_tests.yml
    secrets: inherit

  # Spec/SDK drift. Lives here rather than self-triggering so it reports a
  # status on every PR (running or skipped) and can therefore be a required
  # check — see the header comment in openapi.yml.
  openapi:
    needs: [setup, changes]
    if: needs.changes.outputs.openapi == 'true'
    uses: ./.github/workflows/openapi.yml
    secrets: inherit

  # wasm32 clippy, host tests, release build and the screenshot harness of
  # crates/brokkr-web (BROKKR-T-0351).
  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    uses: ./.github/workflows/console.yml
    secrets: inherit

  # One check that reports on each PR under one name, so branch protection can
  # require it (BROKKR-T-0316). A reusable job reports under its nested names
  # when it runs, and under the caller name when an `if:` skips it, so the
  # per-suite names cannot be required. `skipped` is accepted for the
  # path-filtered suites only; setup, changes and unit_tests must succeed.
  ci_gate:
    name: CI gate
    needs: [setup, changes, unit_tests, integration_tests, sdk_contract_tests, openapi, console]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a suite failed
        env:
          ALWAYS: >-
            setup=${{ needs.setup.result }}
            changes=${{ needs.changes.result }}
            unit_tests=${{ needs.unit_tests.result }}
          FILTERED: >-
            integration_tests=${{ needs.integration_tests.result }}
            sdk_contract_tests=${{ needs.sdk_contract_tests.result }}
            openapi=${{ needs.openapi.result }}
            console=${{ needs.console.result }}
        run: |
          status=0
          for r in $ALWAYS; do
            echo "$r"
            case "${r#*=}" in success) ;; *) echo "::error::${r}"; status=1 ;; esac
          done
          for r in $FILTERED; do
            echo "$r"
            case "${r#*=}" in success|skipped) ;; *) echo "::error::${r}"; status=1 ;; esac
          done
          exit "$status"
  # Advisory on a PR: slow, and it severs links on purpose. Nightly runs it
  # on main each night and files an issue when it fails (BROKKR-T-0323).
  e2e_scenarios:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.e2e_scenarios == 'true'
    uses: ./.github/workflows/e2e_scenarios.yml
    secrets: inherit
