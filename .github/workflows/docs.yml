# Builds the Brokkr docs (docs/, Astro Starlight with starlight-aurora) on each
# pull request that changes them, and publishes them to the GitHub Pages of
# this repository on a push to main (BROKKR-T-0350).
#
# plissken writes the Rust and Python API pages into
# docs/src/content/docs/reference/api/ before the build (plissken.toml), so a
# change to the crates or to the Python SDK also builds the docs.

name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/*/src/**'
      - 'sdks/python/brokkr/brokkr/**'
      - 'plissken.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'crates/*/src/**'
      - 'sdks/python/brokkr/brokkr/**'
      - 'plissken.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  PLISSKEN_VERSION: "0.2.1"
  # sha256 of plissken-<version>-x86_64-unknown-linux-gnu.tar.gz
  PLISSKEN_SHA256: "bf41f2fbc6f375552e29cf56a78b675cf857a1fa689c9905a5caba109ad292bf"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install plissken
        run: |
          tarball="plissken-${PLISSKEN_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLo "$tarball" "https://github.com/colliery-io/plissken/releases/download/v${PLISSKEN_VERSION}/${tarball}"
          echo "${PLISSKEN_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" plissken
          sudo mv plissken /usr/local/bin/

      - name: Write the API pages
        run: plissken render

      - id: pages
        uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - name: Install
        working-directory: docs
        run: npm ci --no-audit --no-fund

      # On a pull request DOCS_SITE and DOCS_BASE are empty, and the site
      # builds at /. On main they come from configure-pages (/brokkr).
      - name: Build
        working-directory: docs
        run: npm run build
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
